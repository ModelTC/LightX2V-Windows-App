name: Bug report
description: Report an issue with setup, GPU detection, model downloads, or image creation
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v0.3.12
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Computer information
      description: Include the Windows version, GPU model, VRAM, system RAM, and driver version. Include the details you know.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Affected step
      options:
        - Opening the app
        - Detecting the GPU or checking graphics software
        - Installing the environment
        - Downloading models
        - Generating or editing images
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce and error details
      description: Describe your actions, the expected result, and what happened. Attach screenshots if helpful.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Detection details or logs (optional)
      description: For GPU detection issues, use Copy detection details in the app. Review usernames, personal paths, prompts, and reference images before sharing them publicly.
      render: text
