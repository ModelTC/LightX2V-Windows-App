name: Promote Latest to Stable
on:
  push:
    tags: [stable]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lightx2v-windows-release
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Promote verified Latest without rebuilding
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/promote_stable.py
      - name: Record Stable download
        run: printf '[Download Stable APP](https://github.com/%s/releases/download/stable/LightX2V-APP-Windows-x64.zip)\n' "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
