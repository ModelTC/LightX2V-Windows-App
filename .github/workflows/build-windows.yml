name: Build Windows App

on:
  push:
    branches: ['**']
    tags-ignore: [latest, stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Latest publication and Stable promotion share the same publisher lock.
concurrency:
  group: lightx2v-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile, package and verify pinned payloads
        run: ./build.ps1
      - name: Verify exact source provenance
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $version = ([xml](Get-Content LightX2V.Windows/LightX2V.Windows.csproj -Raw)).Project.PropertyGroup.Version
          python scripts/verify_package.py dist/LightX2V-APP-Windows-x64.zip --version $version --source-commit $env:SOURCE_COMMIT --require-clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain verified build for publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-package-${{ github.sha }}
          path: |
            dist/LightX2V-APP-Windows-x64.zip
            dist/LightX2V-APP-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified Latest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      deployments: write
    environment:
      name: windows-x64
      url: https://github.com/${{ github.repository }}/releases/tag/latest
    steps:
      - name: Check out publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Windows-package-${{ github.sha }}
          path: dist
      - name: Verify and replace Latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_latest.py dist/LightX2V-APP-Windows-x64.zip
      - name: Record download and verification scope
        run: |
          printf '[Download Latest APP](https://github.com/%s/releases/download/latest/LightX2V-APP-Windows-x64.zip)\n\nSource commit: `%s`. Compilation and package integrity passed. Behavioral and GPU validation run locally; see docs/testing.md.\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
