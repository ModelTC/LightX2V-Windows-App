name: Update English release presentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_release_presentation.py
      - .github/workflows/release-presentation.yml

permissions:
  contents: read

concurrency:
  group: release-presentation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      deployments: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate and update published release presentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_release_presentation.py --apply --backfill-deployment
